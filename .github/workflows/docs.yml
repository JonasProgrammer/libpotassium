
name: Documentation

on:
  push:
    branches:
      - master
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: documentation-publish
  cancel-in-progress: false
  queue: max

jobs:
  docs:
    name: Build documentation
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Build the main website from the repository README.
      - name: Build master site
        if: github.ref == 'refs/heads/master'
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: _site

      # Set up the Nix build environment.
      - uses: cachix/install-nix-action@v32

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # Build Doxygen outside the repository source tree.
      - name: Build documentation
        run: |
          nix develop .#full --command bash -e -c '
            cmake -S . -B "$RUNNER_TEMP/build" -G Ninja \
              -DLIBPOTASSIUM_BUILD_DOCS=ON \
              -DBUILD_TESTING=OFF

            cmake --build "$RUNNER_TEMP/build" \
              --target potassium_docs
          '

      # Retrieve the previously published website.
      - name: Checkout published site
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: _published

      # Replace the main website, preserving all API versions.
      - name: Synchronize master site
        if: github.ref == 'refs/heads/master'
        run: |
          test -f _site/index.html

          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/api/' \
            _site/ _published/

      # Replace only the current branch's API documentation.
      - name: Synchronize branch documentation
        run: |
          source="$RUNNER_TEMP/build/docs/html"
          destination="_published/api/$GITHUB_REF_NAME"

          test -f "$source/index.html"

          mkdir -p "$destination"

          rsync -a --delete \
            "$source/" "$destination/"

      # Persist the complete website for subsequent builds.
      - name: Commit published site
        working-directory: _published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update documentation for $GITHUB_REF_NAME ($GITHUB_SHA)"
            git push origin gh-pages
          fi

      # Upload the complete website for deployment.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _published

  deploy:
    name: Deploy documentation
    needs: docs
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
